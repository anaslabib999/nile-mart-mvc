<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nile-Mart Products')}"></head>

<body>
<nav th:replace="~{fragments :: menu}"></nav>

<h1>Available Products</h1>

<div class="actions"><a th:href="@{/products/new}">+ Add product</a></div>

<table>
    <thead>
    <tr>
        <th>SKU</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Category</th>
        <th>Brand</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${availableProducts}">
        <td th:text="${product.sku}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.inStock}"></td>
        <td th:text="${product.categoryName}"></td>
        <td th:text="${product.brandName}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
