<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <title th:text="${title}">Nile Mart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #333; }
        nav { margin-bottom: 24px; }
        nav a { margin-right: 16px; color: #333; font-weight: bold; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        form label { display: block; margin-bottom: 12px; }
        form input[type=text], form select { display: block; padding: 6px; min-width: 260px; }
        .error { color: #c00; font-size: 0.9em; display: block; }
        .actions { margin: 16px 0; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
<nav th:fragment="menu">
    <a th:href="@{/products}">Products</a>
    <a th:href="@{/categories}">Categories</a>
    <a th:href="@{/brands}">Brands</a>
</nav>
</body>
</html>
